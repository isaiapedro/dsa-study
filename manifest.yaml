      - Current status
      - Repository and Registry boundary
    audit_log:
      - Audit log
    traceability_log:
      - Scope and provenance boundary
      - Authoritative records
    logging_contract:
      - Logging boundary
    testing_contract:
      - Required verification
    registry_update_contract:
      - Update registry of this folder
      - Completion gate
