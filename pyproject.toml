[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsa-study"
version = "0.1.0"
description = "Local LeetCode catalog and Python DSA study workspace"
requires-python = ">=3.11"

[project.scripts]
dsa-study = "dsa_study.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
